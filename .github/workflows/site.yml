name: Project documentation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "images/en-home-1.png"
      - "assets/banners/cursor-byok/minimalist-en-1280x640.png"
      - "apps/desktop/package.json"
      - "apps/desktop/src-tauri/icons/linux-512x512.png"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build static documentation
        run: node site/build.mjs
      - name: Verify content and crawlability
        run: python site/check.py
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    if: github.repository == 'bargino/cursor-byok' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
